<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ostendic admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles/admin.css">
</head>
<body class="adm">
<!-- Ostendic admin (CMS). Edits content/*.json, media/ and vercel.json
     redirects through /api/admin/*. Not linked from the site; noindex;
     robots.txt disallows it. -->

<main class="login" id="login" hidden>
  <form class="login__card" id="loginForm">
    <span class="wordmark">Ostendic</span>
    <h1 class="login__t">Sign in to the admin</h1>
    <p class="muted">Manage pages, blog posts, media, SEO and enquiries.</p>
    <label class="f"><span class="f__l">Password</span>
      <input type="password" id="loginPw" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" role="alert" hidden></p>
    <button class="b b--primary b--wide" type="submit"><span>Log in</span></button>
  </form>
</main>

<div class="app" id="app" hidden>
  <header class="top">
    <button class="b b--plain b--icon top__menu" type="button" id="menuBtn" aria-label="Menu"><span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span></button>
    <a class="top__brand" href="#/dashboard"><span class="wordmark" id="siteName">Ostendic</span><span class="top__tag">Admin</span></a>
    <span class="mode" id="modeBadge"></span>
    <div class="top__end">
      <a class="b b--plain b--sm" href="/" target="_blank" rel="noopener"><span>View site</span></a>
      <button class="b b--plain b--sm" type="button" id="logoutBtn"><span>Log out</span></button>
    </div>
  </header>

  <div class="savebar" id="saveBar" hidden role="region" aria-label="Unsaved changes">
    <span class="savebar__t" id="saveBarText"></span>
    <div class="savebar__act">
      <button class="b b--ghost-inv b--sm" type="button" id="discardBtn"><span>Discard</span></button>
      <button class="b b--inv b--sm" type="button" id="publishBtn" title="Publish (Ctrl+S)"><span>Publish</span></button>
    </div>
  </div>

  <aside class="side" aria-label="Sections"><nav class="nav" id="nav"></nav>
    <p class="side__foot">Ctrl+S publishes. Changes stay local until you publish.</p>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="view"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/scripts/admin/app.js"></script>
</body>
</html>
